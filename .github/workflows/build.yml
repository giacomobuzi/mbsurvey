name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -nE "^(e: |w: .*error|FAILURE|\* What went wrong|> |Execution failed|Caused by|  [^ ]+\.(kt|xml|kts):[0-9]+|error:|Could not|BUILD FAILED)" build.log | head -300 | cut -c1-500; echo '```'; } > errors.md
          cat errors.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "Build failed: run ${{ github.run_number }}" --body-file errors.md || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WiFiSurvey-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiSurvey-apk
          path: WiFiSurvey-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" WiFiSurvey-*.apk \
            --title "WiFiSurvey $TAG" \
            --notes "Build automatica. Scarica l'APK e installalo sul telefono (consenti l'installazione da origini sconosciute)." \
            --latest
