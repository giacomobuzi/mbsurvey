name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WiFiSurvey-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiSurvey-apk
          path: WiFiSurvey-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" WiFiSurvey-*.apk \
            --title "WiFiSurvey $TAG" \
            --notes "Build automatica. Scarica l'APK e installalo sul telefono (consenti l'installazione da origini sconosciute)." \
            --latest
